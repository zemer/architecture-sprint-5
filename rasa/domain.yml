version: "3.1"

intents:
  - greet
  - goodbye
  - inform
  - ask_architecture
  - ask_microservices
  - ask_approaches
  - ask_choose_approach
  - affirm
  - deny
  - request_info

responses:
  utter_greet:
    - text: "Привет! Чем могу помочь в области архитектуры программного обеспечения?"

  utter_goodbye:
    - text: "До свидания! Если появятся вопросы по архитектуре ПО, обращайтесь."

  utter_ask_more:
    - text: "Что именно вас интересует в архитектуре программного обеспечения?"

  utter_acknowledge:
    - text: "Понял, расскажите подробнее о вашем проекте или задачах."

  utter_architecture_response:
    - text: "Архитектура ПО включает выбор структур, которые обеспечивают масштабируемость, гибкость и поддерживаемость приложения. Задайте конкретный вопрос по этой теме, и я помогу вам с информацией."

  utter_microservices_response:
    - text: "Микросервисная архитектура — это подход к разработке программного обеспечения, при котором приложение разбивается на небольшие независимые сервисы, которые могут работать вместе."

  utter_approaches_response:
    - text: "В архитектуре программного обеспечения существует несколько подходов, каждый из которых имеет свои особенности и преимущества. Вот некоторые из наиболее распространённых подходов: монолитная архитектура, микросервисная архитектура, сервис-ориентированная архитектура (SOA)"

  utter_choose_approaches_response:
    - text: "Выбор архитектуры программного обеспечения зависит от множества факторов, включая требования к проекту, его масштаб, сроки разработки, доступные ресурсы и предполагаемый рост. Вот несколько шагов, которые помогут вам выбрать подходящую архитектуру: определите цели и требования проекта, оцените масштаб проекта, учитывайте потребности в масштабируемости и гибкости, рассмотрите возможность интеграции с другими системами, подумайте о безопасности и надёжности, изучите опыт других разработчиков, протестируйте разные архитектуры, обратитесь за советом к экспертам"

entities:
  - topic

slots:
  topic:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
